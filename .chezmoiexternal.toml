[".config/zsh/plugins/zsh-autosuggestions"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-autosuggestions/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

{{ $ezaVersion := "0.23.4" -}}
[".local/bin/eza"]
    type = "archive-file"
    url = "https://github.com/eza-community/eza/releases/download/v{{ $ezaVersion }}/eza_x86_64-unknown-linux-gnu.tar.gz"
    path = "./eza"

{{ $nerdFontsVersion := "3.4.0" -}}
[".local/share/fonts/jetbrains-mono-nerd-fonts"]
    type = "archive"
    url = "https://github.com/ryanoasis/nerd-fonts/releases/download/v{{ $nerdFontsVersion }}/JetBrainsMono.tar.xz"
    exact = true
    include = ["JetBrainsMonoNerdFont-*.ttf", "*.txt", "*.md"]

[".local/bin/atlas"]
    type = "file"
    url = "https://atlasbinaries.com/atlas/atlas-community-linux-amd64-latest"
    checksum.sha256 = "cec3c78d780f29232a62660cecb64d6508a6e11ced5b5fa0e128c0880c6082d6"
    executable = true

[".local/bin/android"]
    type = "file"
    url = "https://dl.google.com/android/cli/latest/linux_x86_64/android"
    executable = true
